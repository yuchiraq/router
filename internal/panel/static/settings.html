<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки GPT · Router</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/panel.js" defer></script>
    <script src="/static/settings.js" defer></script>
</head>
<body>
<nav class="nav"><div class="nav-container"><a href="/" class="nav-logo">Router</a><div class="nav-links"><a href="/">Маршруты</a><a href="/settings" class="active">GPT</a></div></div></nav>
<main class="container">
    <header class="header"><h1>Настройки GPT</h1></header>
    <form id="gpt-form">
        <fieldset id="gpt-fields" class="plain-fieldset" disabled>
            <section class="settings-section">
                <div><h2>Подключение</h2></div>
                <div class="form-grid">
                    <label class="check-row full"><input type="checkbox" id="enabled">Ответы GPT в Telegram</label>
                    <label class="field">Ключ OpenAI<input type="password" id="apiKey" class="form-control" autocomplete="off" placeholder="sk-…"></label>
                    <label class="field">Модель<input id="model" class="form-control" placeholder="gpt-4o-mini"></label>
                </div>
            </section>
            <section class="settings-section">
                <div><h2>Ответы и контекст</h2></div>
                <div class="form-grid">
                    <label class="field full">Системная инструкция<textarea id="systemPrompt" class="form-control" rows="7" placeholder="Правила и стиль ответов"></textarea></label>
                    <label class="field">Строк журнала в запросе<input id="maxLogLines" class="form-control" type="number" min="1" max="500" value="20" required></label>
                    <label class="field">Разрешённые ID чатов<input id="onlyChatIds" class="form-control" placeholder="-100123456, 123456789"><small>Пустое поле: без ограничения по чатам</small></label>
                </div>
            </section>
        </fieldset>
        <div class="action-bar"><button class="btn" type="submit" id="save-btn" disabled>Сохранить</button><p id="status-msg" class="status-line" role="status">Загрузка настроек…</p></div>
    </form>
</main>
</body>
</html>
