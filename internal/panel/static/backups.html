<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Резервные копии · Router by Qoncept</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/design.css">
    <link rel="stylesheet" href="/static/backups.css">
    <script src="/static/panel.js" defer></script>
    <script src="/static/design.js" defer></script>
    <script src="/static/backups.js" defer></script>
</head>
<body>
    <nav class="nav"><div class="nav-container"><a href="/" class="nav-logo">Router by Qoncept</a><div class="nav-links"><a href="/">Маршруты</a><a href="/backups" class="active">Копии</a></div></div></nav>
    <main class="container backups-page">
        <header class="header"><div><p class="eyebrow">Хранение и восстановление</p><h1>Резервные копии</h1></div><button class="btn" id="new-job-btn" type="button"><span class="icon" style="--icon:url(/static/icons/plus.svg)" aria-hidden="true"></span>Новое задание</button></header>
        <section class="route-overview backup-overview" aria-label="Сводка резервных копий">
            <div><span>По расписанию</span><strong id="backup-active">—</strong></div>
            <div><span>Архивов</span><strong id="backup-count">—</strong></div>
            <div><span>Объём архивов</span><strong id="backup-size">—</strong></div>
            <div><span>Последняя копия</span><strong id="backup-latest" class="summary-date">—</strong></div>
        </section>
        <p id="status-msg" class="status-line" role="status" aria-live="polite"></p>
        <details id="backup-error" class="backup-error" hidden><summary><span class="icon" style="--icon:url(/static/icons/triangle-alert.svg)" aria-hidden="true"></span>Ошибка последнего копирования</summary><p id="backup-error-detail" class="diagnostic-text"></p></details>
        <div class="list-toolbar backup-toolbar">
            <div class="fluid-tabs" role="tablist" aria-label="Резервные копии">
                <button type="button" role="tab" id="jobs-tab" aria-selected="true" aria-controls="jobs-panel" data-backup-tab="jobs">Задания <span id="jobs-count">0</span></button>
                <button type="button" role="tab" id="archives-tab" aria-selected="false" aria-controls="archives-panel" tabindex="-1" data-backup-tab="archives">Архивы <span id="archives-count">0</span></button>
            </div>
            <div class="backup-tools"><label class="search-field"><span class="icon" style="--icon:url(/static/icons/search.svg)" aria-hidden="true"></span><input id="backup-search" class="form-control" type="search" placeholder="Найти задание или архив…" aria-label="Поиск резервных копий"></label><button id="refresh-backups" type="button" class="btn btn-icon" title="Обновить" aria-label="Обновить резервные копии"><span class="icon" style="--icon:url(/static/icons/rotate-ccw.svg)" aria-hidden="true"></span></button></div>
        </div>
        <section id="jobs-panel" role="tabpanel" aria-labelledby="jobs-tab"><div class="backup-columns" aria-hidden="true"><span>Задание / папка</span><span>Последняя копия</span><span>Действия</span></div><div id="jobs-table" aria-live="polite"><p class="disk-empty">Загрузка заданий…</p></div></section>
        <section id="archives-panel" role="tabpanel" aria-labelledby="archives-tab" hidden><div class="archive-filter"><label for="archive-job">Задание</label><select id="archive-job" class="form-control"><option value="">Все задания</option></select></div><div class="backup-columns archive-columns" aria-hidden="true"><span>Архив / путь</span><span>Создан</span><span>Размер</span></div><div id="backups-table" aria-live="polite"></div></section>
    </main>
    <dialog id="settings-card" class="sheet backup-editor" aria-labelledby="editor-title">
        <form id="backup-form">
            <div class="sheet-header"><h2 id="editor-title">Новое задание</h2><button class="btn btn-icon" type="button" id="close-editor" aria-label="Закрыть редактор" title="Закрыть"><span class="icon" style="--icon:url(/static/icons/x.svg)" aria-hidden="true"></span></button></div>
            <input type="hidden" id="job-id" name="id">
            <div class="form-grid">
                <label class="field full">Название<input class="form-control" id="name" name="name" placeholder="Например, документы WorkService" maxlength="200" required></label>
                <label class="field full">Исходные файлы и папки<textarea class="form-control" id="sources" name="sources" rows="3" placeholder="/home/user/project/data" required></textarea><small>По одному пути на строку</small></label>
                <label class="field full">Папка для архивов<input class="form-control" id="destinationDir" name="destinationDir" placeholder="/mnt/backups" required></label>
                <label class="field">Хранить копий<input class="form-control" id="keepCopies" name="keepCopies" type="number" min="1" max="10000" step="1" value="10" required></label>
                <label class="field">Интервал, мин<input class="form-control" id="intervalMinutes" name="intervalMinutes" type="number" min="1" max="525600" step="1" value="60" required></label>
                <label class="check-row full"><input type="checkbox" id="enabled" name="enabled">Автоматически по расписанию</label>
            </div>
            <p id="editor-error" class="status-line" role="alert" hidden></p>
            <div class="sheet-actions backup-editor-actions"><button class="btn btn-danger btn-icon" id="delete-btn" type="button" title="Удалить задание и его архивы" aria-label="Удалить задание и его архивы" hidden><span class="icon" style="--icon:url(/static/icons/trash-2.svg)" aria-hidden="true"></span></button><button class="btn btn-secondary" id="cancel-editor" type="button">Отмена</button><button class="btn" id="save-btn" type="submit">Сохранить</button></div>
        </form>
    </dialog>
</body>
</html>
