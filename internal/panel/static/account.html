<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аккаунт · Router by Qoncept</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/design.css">
    <script src="/static/panel.js" defer></script>
    <script src="/static/design.js" defer></script>
</head>
<body>
<nav class="nav"><div class="nav-container"><a href="/account" class="nav-logo">Router by Qoncept</a><div class="nav-links"><a href="/">Маршруты</a><a href="/stats">Обзор</a><a href="/backups">Копии</a><a href="/notifications">Уведомления</a><a href="/settings">GPT</a><a href="/account" class="active">Аккаунт</a></div></div></nav>
<main class="container">
<div class="header"><h1>Аккаунт</h1></div>
<div class="account-identity"><div class="account-avatar"><span class="icon" style="--icon:url(/static/icons/user-round.svg)" aria-hidden="true"></span></div><div><strong id="account-name">Аккаунт</strong><p>Администратор роутера</p></div></div>
<form id="account-form" class="account-form">
<label class="field">Логин<input id="username" class="form-control" autocomplete="username" required disabled></label>
<label class="field">Новый пароль<input id="password" type="password" class="form-control" autocomplete="new-password" minlength="12" maxlength="72" aria-describedby="password-help" required disabled><small id="password-help">От 12 символов, до 72 байт</small></label>
<div><button type="submit" id="save-btn" class="btn" disabled>Сохранить изменения</button></div>
<p id="status" class="status-line" role="status">Загрузка аккаунта…</p>
</form>
<section class="settings-section" style="margin-top:24px;"><h2>Сессия</h2><div><button type="button" id="logout-btn" class="btn btn-secondary">Выйти из аккаунта</button></div></section>
</main>
<script src="/static/account.js" defer></script>
</body>
</html>
