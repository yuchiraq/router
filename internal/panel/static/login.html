<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход · Router by Qoncept</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/design.css">
    <script src="/static/panel.js" defer></script>
    <script src="/static/design.js" defer></script>
</head>
<body class="auth-page">
    <header class="auth-top"><div class="auth-brand"><span class="icon" style="--icon:url(/static/icons/qoncept.svg)" aria-hidden="true"></span><span class="brand-lockup"><strong>Router</strong><small>by Qoncept</small></span></div><button class="btn btn-icon" type="button" data-cycle-theme aria-label="Переключить тему" title="Переключить тему"><span class="icon" style="--icon:url(/static/icons/sun-moon.svg)" aria-hidden="true"></span></button></header>
    <main class="auth-content">
            <div class="auth-emblem"><span class="icon" style="--icon:url(/static/icons/qoncept.svg)" aria-hidden="true"></span></div>
            <h1>Router <span class="login-byline">by Qoncept</span></h1>
            <p>Панель управления сервисами</p>
            <form id="login-form">
            <label class="field" style="margin-bottom:16px;">Логин<input id="username" class="form-control" autocomplete="username" required></label>
            <label class="field" style="margin-bottom:20px;">Пароль<input id="password" class="form-control" type="password" autocomplete="current-password" required></label>
            <button type="submit" class="btn" id="login-btn">Войти<span class="icon" style="--icon:url(/static/icons/arrow-right.svg)" aria-hidden="true"></span></button>
            </form>
            <p id="status" style="margin-top:10px;color:var(--accent-red);"></p>
            <p class="auth-footer">Доступ для администратора</p>
    </main>
<script src="/static/login.js" defer></script>
</body>
</html>
