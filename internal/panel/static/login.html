<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход · Router</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/design.css">
    <script src="/static/panel.js" defer></script>
    <script src="/static/design.js" defer></script>
</head>
<body class="auth-page">
    <header class="auth-top"><div class="auth-brand"><span class="icon" style="--icon:url(/static/icons/network.svg)" aria-hidden="true"></span>Router</div><button class="btn btn-icon" type="button" data-cycle-theme aria-label="Переключить тему" title="Переключить тему"><span class="icon" style="--icon:url(/static/icons/sun-moon.svg)" aria-hidden="true"></span></button></header>
    <main class="auth-content">
            <div class="auth-emblem"><span class="icon" style="--icon:url(/static/icons/network.svg)" aria-hidden="true"></span></div>
            <h1>Вход в Router</h1>
            <p>Панель управления сервисами</p>
            <form id="login-form">
            <label class="field" style="margin-bottom:16px;">Логин<input id="username" class="form-control" autocomplete="username" required></label>
            <label class="field" style="margin-bottom:20px;">Пароль<input id="password" class="form-control" type="password" autocomplete="current-password" required></label>
            <button type="submit" class="btn" id="login-btn">Войти<span class="icon" style="--icon:url(/static/icons/arrow-right.svg)" aria-hidden="true"></span></button>
            </form>
            <p id="status" style="margin-top:10px;color:var(--accent-red);"></p>
            <p class="auth-footer">Доступ для администратора</p>
    </main>
<script>
(function(){
  function setStatus(t){document.getElementById('status').textContent=t||''}
  document.getElementById('login-form').addEventListener('submit', function(event){
    event.preventDefault();
    var button = document.getElementById('login-btn');
    if (button.disabled) return;
    button.disabled = true; button.textContent = 'Вход…'; setStatus('');
    var b=new URLSearchParams();
    b.set('username', document.getElementById('username').value.trim());
    b.set('password', document.getElementById('password').value);
    fetch('/login',{method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:b.toString()})
      .then(function(r){ if(!r.ok) throw new Error(r.status === 429 ? 'Слишком много попыток. Попробуйте позже.' : r.status >= 500 ? 'Сервер недоступен. Попробуйте позже.' : 'Неверный логин или пароль'); location.href='/'; })
      .catch(function(e){ setStatus(e instanceof TypeError ? 'Нет связи с сервером' : e.message); button.disabled=false; button.textContent='Войти'; });
  });
})();
</script>
</body>
</html>
