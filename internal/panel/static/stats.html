<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обзор сервера · Router by Qoncept</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/design.css">
    <script src="/static/panel.js" defer></script>
    <script src="/static/design.js" defer></script>
    <script src="/static/chart.js"></script>
    <script src="/static/color-hash.js"></script>
    <style>
        .btn-icon { padding: 4px 8px; min-width: auto; line-height: 1; background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); font-size: 12px; }
        .stats-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
        .stats-toolbar p { margin:0; color:var(--text-secondary); }
        .dashboard-canvas { position:relative; width:100%; min-height:1120px; border:1px dashed var(--border-color); border-radius:12px; }
        .dashboard-widget { position:absolute; margin:0; min-width:260px; min-height:220px; display:flex; flex-direction:column; }
        .dashboard-widget .card-header { cursor:grab; user-select:none; display:flex; align-items:center; gap:10px; }
        .dashboard-widget .card-body { flex:1; min-height:0; overflow:auto; }
        .dashboard-widget canvas { min-height:220px; }
        .widget-handle { color:var(--text-secondary); font-size:18px; line-height:1; }
        .dashboard-widget.dragging { opacity:0.88; z-index:50; box-shadow:0 10px 30px rgba(0,0,0,.35); }
        .widget-resizer { position:absolute; right:8px; bottom:8px; width:16px; height:16px; cursor:nwse-resize; background:linear-gradient(135deg, transparent 0 40%, var(--accent-blue) 40% 55%, transparent 55% 70%, var(--accent-blue) 70% 85%, transparent 85% 100%); }
        @media (max-width: 900px) {
            .stats-toolbar { flex-direction:column; align-items:flex-start; }
            .dashboard-canvas { min-height:1400px; }
        }
    </style>
    <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-container">
            <a href="/account" class="nav-logo">Router by Qoncept</a>
            <div class="nav-links">
                <a href="/">Маршруты</a>
                <a href="/stats" class="active">Обзор</a>
                <a href="/backups">Копии</a>
                <a href="/notifications">Уведомления</a>
                <a href="/settings">GPT</a>
            </div>
        </div>
    </nav>
    <main class="container">
        <div class="header">
            <h1>Обзор сервера</h1>
        </div>

        <div class="stats-toolbar">
            <p id="stats-status" role="status">Загрузка показателей…</p>
            <div class="form-inline layout-tools"><label for="layout-mode">Расположение</label><select id="layout-mode" class="form-control"><option value="grid">Сетка</option><option value="free">Свободное</option></select><button type="button" class="btn btn-icon" id="reset-layout-btn" title="Сбросить расположение" aria-label="Сбросить расположение"><span class="icon" style="--icon:url(/static/icons/rotate-ccw.svg)" aria-hidden="true"></span></button></div>
        </div>

        <section class="dashboard-canvas" id="dashboard-canvas">
            <div class="card dashboard-widget" data-widget-id="memory" style="left:0px;top:0px;width:480px;height:320px;">
                <div class="card-header"><span class="widget-handle">⋮⋮</span><span>Оперативная память</span></div>
                <div class="card-body"><canvas id="memory-chart"></canvas></div><div class="widget-resizer" title="Изменить размер"></div>
            </div>
            <div class="card dashboard-widget" data-widget-id="cpu" style="left:500px;top:0px;width:480px;height:320px;">
                <div class="card-header"><span class="widget-handle">⋮⋮</span><span>Процессор</span></div>
                <div class="card-body"><canvas id="cpu-chart"></canvas></div><div class="widget-resizer" title="Изменить размер"></div>
            </div>
            <div class="card dashboard-widget" data-widget-id="requests" style="left:1000px;top:0px;width:560px;height:320px;">
                <div class="card-header"><span class="widget-handle">⋮⋮</span><span>Запросы по часам</span></div>
                <div class="card-body"><canvas id="requests-chart"></canvas></div><div class="widget-resizer" title="Изменить размер"></div>
            </div>
            <div class="card dashboard-widget" data-widget-id="ssh" style="left:0px;top:340px;width:760px;height:340px;">
                <div class="card-header"><span class="widget-handle">⋮⋮</span><span>Подключения SSH</span></div>
                <div class="card-body"><div class="ssh-current" id="ssh-current">Активных подключений: 0</div><div class="ssh-table ssh-table-head"><div>IP</div><div>Страна</div><div>Дата</div><div>Время</div><div>Устройство</div></div><div class="ssh-table" id="ssh-table"></div></div><div class="widget-resizer" title="Изменить размер"></div>
            </div>
            <div class="card dashboard-widget" data-widget-id="countries" style="left:780px;top:340px;width:380px;height:340px;">
                <div class="card-header"><span class="widget-handle">⋮⋮</span><span>География запросов</span></div>
                <div class="card-body"><div class="country-table" id="country-table"></div></div><div class="widget-resizer" title="Изменить размер"></div>
            </div>
            <div class="card dashboard-widget" data-widget-id="disks" style="left:1180px;top:340px;width:380px;height:340px;">
                <div class="card-header"><span class="widget-handle">⋮⋮</span><span>Диски</span></div>
                <div class="card-body"><div class="disk-table" id="disk-table"></div></div><div class="widget-resizer" title="Изменить размер"></div>
            </div>
            <div class="card dashboard-widget" data-widget-id="suspicious" style="left:0px;top:700px;width:780px;height:360px;">
                <div class="card-header"><span class="widget-handle">⋮⋮</span><span>Подозрительные IP</span></div>
                <div class="card-body"><div style="display:flex; gap:8px; margin-bottom:12px; align-items:center; flex-wrap:wrap;"><input type="text" id="manual-ban-ip" class="form-control" placeholder="IP для блокировки" style="max-width:360px;"><button class="btn btn-danger" id="manual-ban-btn" type="button">Заблокировать</button></div><div class="disk-table" id="suspicious-table"></div></div><div class="widget-resizer" title="Изменить размер"></div>
            </div>
            <div class="card dashboard-widget" data-widget-id="autobanned" style="left:800px;top:700px;width:760px;height:360px;">
                <div class="card-header"><span class="widget-handle">⋮⋮</span><span>Автоблокировки · 24 ч</span></div>
                <div class="card-body"><div class="disk-table" id="auto-banned-table"></div></div><div class="widget-resizer" title="Изменить размер"></div>
            </div>
        </section>

        <script src="/static/stats.js" defer></script>
    </main>
</body>
</html>
