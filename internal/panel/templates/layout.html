
{{define "layout"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{template "title" .}} - Router</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/panel.js" defer></script>
    {{template "head" .}}
</head>
<body>
    <nav class="nav">
        <div class="nav-container">
            <a href="/account" class="nav-logo">Router</a>
            <div class="nav-links">
                <a href="/" class="{{if eq .Page "index"}}active{{end}}">Маршруты</a>
                <a href="/stats" class="{{if eq .Page "stats"}}active{{end}}">Обзор</a>
                <a href="/backups" class="{{if eq .Page "backups"}}active{{end}}">Копии</a>
                <a href="/notifications" class="{{if eq .Page "notifications"}}active{{end}}">Уведомления</a>
                <a href="/settings" class="{{if eq .Page "settings"}}active{{end}}">GPT</a>
            </div>
        </div>
    </nav>
    <main class="container">
        {{template "content" .Data}}
    </main>
</body>
</html>
{{end}}
